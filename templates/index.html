<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CRM Suvenirka</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse: collapse;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    font-size:14px;
}

th{
    background:#222;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

/* Цвета статусов */

.status-new { color: green; font-weight:bold; }
.status-canceled { color: gray; font-weight:bold; }
.status-np { color: blue; font-weight:bold; }
.status-up { color: #03a9f4; font-weight:bold; }
.status-ttn { color: orange; font-weight:bold; }
.status-shipped { color: purple; font-weight:bold; }
.status-hold { color: #fbc02d; font-weight:bold; }
.status-bad { color: brown; font-weight:bold; }
.status-notpaid { color: #6d1b1b; font-weight:bold; }

a{
    text-decoration:none;
    color:#0066cc;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>CRM Suvenirka</h1>

<table>
<tr>
    <th>Woo ID</th>
    <th>Клиент</th>
    <th>Телефон</th>
    <th>Статус</th>
    <th>Сумма</th>
</tr>

{% for o in orders %}
<tr>
<td>
    <a href="/order/{{ o['woo_id'] }}">
        {{ o["woo_id"] }}
    </a>
</td>

<td>{{ o["customer_name"] }}</td>
<td>{{ o["phone"] }}</td>

<td class="
{% if o['status']=='Новый' %}status-new{% endif %}
{% if o['status']=='Отменён' %}status-canceled{% endif %}
{% if o['status']=='Подтверждён НП' %}status-np{% endif %}
{% if o['status']=='Подтверждён УП' %}status-up{% endif %}
{% if o['status']=='Создана ТТН' %}status-ttn{% endif %}
{% if o['status']=='Отправлено' %}status-shipped{% endif %}
{% if o['status']=='На удержании' %}status-hold{% endif %}
{% if o['status']=='Невменяшка' %}status-bad{% endif %}
{% if o['status']=='Не оплачен' %}status-notpaid{% endif %}
">
{{ o["status"] }}
</td>

<td>{{ o["amount"] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
