<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CRM Suvenirka</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse: collapse;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    font-size:14px;
}

th{
    background:#222;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

/* Цвета статусов */

.badge{display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;}
.badge--new{background:#1976d2; color:#fff;}
.badge--not-paid{background:#d32f2f; color:#fff;}
.badge--hold{background:#cddc39; color:#1b1b1b;}
.badge--ttn{background:#fb8c00; color:#fff;}
.badge--confirmed-np{background:#1976d2; color:#fff;}
.badge--confirmed-up{background:#03a9f4; color:#00324a;}
.badge--shipped{background:#7b1fa2; color:#fff;}
.badge--canceled{background:#616161; color:#fff;}
.badge--bad{background:#212121; color:#fff;}
.badge--paid{background:#2e7d32; color:#fff;}

a{
    text-decoration:none;
    color:#0066cc;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>CRM Suvenirka</h1>

<table>
<tr>
    <th>Woo ID</th>
    <th>Клиент</th>
    <th>Телефон</th>
    <th>Статус</th>
    <th>Сумма</th>
</tr>

{% for o in orders %}
<tr>
<td>
    <a href="/order/{{ o['woo_id'] }}">
        {{ o["woo_id"] }}
    </a>
</td>

<td>{{ o["customer_name"] }}</td>
<td>{{ o["phone"] }}</td>

<td>
    <span class="badge {{ o['status_class'] }}">{{ o['status_label'] }}</span>
</td>

<td>{{ o["amount"] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
