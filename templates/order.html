<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заказ {{ o['woo_id'] }}</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

/* ----- CARD ----- */
.card{
    max-width:1000px;
    margin:20px auto;
    background:#fff;
    padding:18px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

/* ----- TOP BAR ----- */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

/* ----- FORM ----- */
input,select,textarea{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    font-size:14px;
    box-sizing:border-box;
}

label{
    display:block;
    margin-bottom:4px;
    font-size:13px;
}

.row{margin-bottom:15px;}

.grid-3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* ----- BADGES ----- */
.badge{
    padding:6px 14px;
    border-radius:20px;
    color:#fff;
    font-weight:700;
    font-size:13px;
}

.badge--new{background:#2e7d32;}
.badge--not_paid{background:#d32f2f;}
.badge--hold{background:#cddc39;color:#111;}
.badge--ttn{background:#fb8c00;}
.badge--confirmed_np{background:#1976d2;}
.badge--confirmed_up{background:#03a9f4;}
.badge--shipped{background:#7b1fa2;}
.badge--canceled{background:#616161;}

/* ----- ITEMS TABLE ----- */
.items{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.items th,.items td{
    border:1px solid #ccc;
    padding:8px;
}

.items th:nth-child(1){width:55%;}
.items th:nth-child(2){width:10%;}
.items th:nth-child(3){width:25%;}
.items th:nth-child(4){width:40px;}

.items th{
    background:#f3f3f3;
}

/* ----- BUTTONS ----- */
.actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    flex-wrap:wrap;
    gap:10px;
}

.left-actions button{
    background:#8b1d1d;
    color:#fff;
}

.center-actions button{
    background:#1976d2;
    color:#fff;
}

.right-actions button{
    background:#222;
    color:#fff;
}

button{
    padding:10px 14px;
    border:0;
    font-weight:700;
    cursor:pointer;
}

/* ----- MOBILE ----- */
@media(max-width:700px){

.grid-3{grid-template-columns:1fr;}
.grid-2{grid-template-columns:1fr;}

.topbar{
    flex-direction:column;
    gap:10px;
}

}
</style>
</head>

<body>

<div class="card">

<div class="topbar">
    <h2>Заказ №{{ o['woo_id'] }}</h2>
    <span class="badge badge--{{ o['status_code'] }}">{{ o['status_label'] }}</span>
</div>

<form method="post">

<!-- ================= ТОВАРЫ ================= -->

<div class="row">
<label>Товары</label>

<table class="items" id="itemsTable">
<tr>
    <th>Товар</th>
    <th>Кол-во</th>
    <th>Сумма</th>
    <th></th>
</tr>

{% for it in items %}
<tr>
<td>
<input type="text" name="item_name" value="{{ it.get('name','') }}">
</td>

<td>
<input type="number" name="item_qty" value="{{ it.get('qty',1) }}">
</td>

<td>
<input type="text" name="amount" value="{{ o.get('amount','') }}">
</td>

<td>
<button type="button" onclick="removeRow(this)">×</button>
</td>
</tr>
{% endfor %}
</table>

<button type="button" onclick="addRow()">+ Добавить</button>
</div>

<!-- ================= КОНТАКТЫ ================= -->

<div class="grid-3">
<div>
<label>Телефон</label>
<input type="text" name="phone" value="{{ o.get('phone','') }}">
</div>

<div>
<label>Фамилия</label>
<input type="text" name="last_name" value="{{ o.get('last_name','') }}">
</div>

<div>
<label>Имя</label>
<input type="text" name="first_name" value="{{ o.get('first_name','') }}">
</div>
</div>

<!-- ================= АДРЕС ================= -->

<div class="grid-2">
<div>
<label>Город</label>
<input type="text" name="city" value="{{ o.get('city','') }}">
</div>

<div>
<label>Отделение / Индекс</label>
<input type="text" name="address" value="{{ o.get('address','') }}">
</div>
</div>

<!-- ================= ОПЛАТА / СТАТУС ================= -->

<div class="grid-2">
<div>
<label>Оплата</label>
<select name="payment_state">
<option value="not_paid">Не оплачено</option>
<option value="cod">Готівка при отриманні</option>
<option value="paid">Оплачено</option>
</select>
</div>

<div>
<label>Статус</label>
<select name="status">
{% for code, meta in status_badges.items() %}
<option value="{{ code }}" {% if code==o['status_code'] %}selected{% endif %}>
{{ meta['label'] }}
</option>
{% endfor %}
</select>
</div>
</div>

<!-- ================= КОММЕНТАРИЙ ================= -->

<div class="row">
<label>Комментарий</label>
<textarea name="comment">{{ o.get('comment','') }}</textarea>
</div>

<!-- ================= КНОПКИ ================= -->
<div class="actions">

  <!-- ЛЕВО -->
  <div class="left-actions">
    <button
      formaction="{{ url_for('delete_order', woo_id=o['woo_id']) }}"
      onclick="return confirm('Удалить заказ?')"
      style="background:#8b1d1d;color:#fff;">
      Удалить
    </button>

    <button type="button"
            onclick="window.location='/'"
            style="background:#e0e0e0;color:#000;">
      Назад
    </button>
  </div>

  <!-- ЦЕНТР -->
  <div class="center-actions">
    <button type="submit"
            name="quick_status"
            value="confirmed_np"
            style="background:#1976d2;color:#fff;">
      Підтверджен НП
    </button>

    <button type="submit"
            name="quick_status"
            value="confirmed_up"
            style="background:#2196f3;color:#fff;">
      Підтверджен УП
    </button>

    <button type="submit"
            name="quick_status"
            value="ttn"
            style="background:#fb8c00;color:#fff;">
      Створено ТТН
    </button>
  </div>

  <!-- ПРАВО -->
  <div class="right-actions">
    <button type="button"
            onclick="window.location='/'"
            style="background:#e0e0e0;color:#000;">
      Закрыть
    </button>

    <button type="submit"
            style="background:#222;color:#fff;">
      Сохранить
    </button>
  </div>

</div>

</form>

</div>

<script>
function addRow(){
    let t=document.getElementById("itemsTable");
    let r=t.insertRow(-1);
    r.innerHTML=`
<td><input type="text" name="item_name"></td>
<td><input type="number" name="item_qty" value="1"></td>
<td><input type="text" name="amount"></td>
<td><button type="button" onclick="removeRow(this)">×</button></td>
`;
}

function removeRow(btn){
    btn.closest("tr").remove();
}
</script>

</body>
</html>
